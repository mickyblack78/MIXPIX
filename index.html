<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXPIX - Media Vault</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .filter-btn {
            background-color: #334155;
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .filter-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        #file-input {
            display: none;
        }

        main {
            padding: 2rem;
            flex: 1;
        }

        .drop-zone {
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-muted);
            transition: border-color 0.2s, background-color 0.2s;
        }

        .drop-zone.dragover {
            border-color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .media-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            aspect-ratio: 1;
            cursor: pointer;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .media-card:hover {
            transform: translateY(-4px);
        }

        .media-card img, .media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-card .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(15, 23, 42, 0.8);
            color: var(--danger-color);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .media-card:hover .delete-btn {
            opacity: 1;
        }

        .media-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background-color: rgba(15, 23, 42, 0.7);
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🎬</span> MIXPIX
        </div>
        <div class="controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="image">Images</button>
            <button class="filter-btn" data-filter="video">Videos</button>
            <label for="file-input" class="btn">
                <span>+ Upload</span>
            </label>
            <input type="file" id="file-input" multiple accept="image/*,video/*">
        </div>
    </header>

    <main>
        <div class="drop-zone" id="drop-zone">
            Drag & Drop image or video files here to add them to MIXPIX
        </div>

        <div class="gallery-grid" id="gallery"></div>
        <div class="empty-state" id="empty-state" style="display: none;">
            No media found. Upload images or videos to get started!
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" id="close-lightbox">&times;</button>
        <div class="lightbox-content" id="lightbox-content"></div>
    </div>

    <script>
        let db;
        let activeFilter = 'all';

        // Initialize IndexedDB
        const request = indexedDB.open('MIXPIX_DB', 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('media')) {
                db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            loadMedia();
        };

        request.onerror = (e) => {
            console.error('IndexedDB Error:', e);
        };

        // File Selection & Drag/Drop
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const mediaItem = {
                            name: file.name,
                            type: file.type.startsWith('image/') ? 'image' : 'video',
                            mime: file.type,
                            data: e.target.result,
                            timestamp: Date.now()
                        };
                        saveMedia(mediaItem);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function saveMedia(item) {
            const tx = db.transaction('media', 'readwrite');
            const store = tx.objectStore('media');
            store.add(item);
            tx.oncomplete = () => loadMedia();
        }

        function loadMedia() {
            const tx = db.transaction('media', 'readonly');
            const store = tx.objectStore('media');
            const request = store.getAll();

            request.onsuccess = () => {
                let items = request.result;
                if (activeFilter !== 'all') {
                    items = items.filter(item => item.type === activeFilter);
                }
                renderGallery(items);
            };
        }

        function renderGallery(items) {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('empty-state');
            gallery.innerHTML = '';

            if (items.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';

                let element;
                if (item.type === 'image') {
                    element = document.createElement('img');
                    element.src = item.data;
                    element.alt = item.name;
                } else {
                    element = document.createElement('video');
                    element.src = item.data;
                    element.muted = true;
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '&#10005;';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteMedia(item.id);
                };

                const badge = document.createElement('span');
                badge.className = 'media-badge';
                badge.innerText = item.type;

                card.appendChild(element);
                card.appendChild(deleteBtn);
                card.appendChild(badge);

                card.onclick = () => openLightbox(item);

                gallery.appendChild(card);
            });
        }

        function deleteMedia(id) {
            const tx = db.transaction('media', 'readwrite');
            const store = tx.objectStore('media');
            store.delete(id);
            tx.oncomplete = () => loadMedia();
        }

        // Filtering
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeFilter = e.target.dataset.filter;
                loadMedia();
            });
        });

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxContent = document.getElementById('lightbox-content');
        const closeLightbox = document.getElementById('close-lightbox');

        function openLightbox(item) {
            lightboxContent.innerHTML = '';
            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.data;
                lightboxContent.appendChild(img);
            } else {
                const video = document.createElement('video');
                video.src = item.data;
                video.controls = true;
                video.autoplay = true;
                lightboxContent.appendChild(video);
            }
            lightbox.classList.add('active');
        }

        closeLightbox.onclick = () => {
            lightbox.classList.remove('active');
            lightboxContent.innerHTML = '';
        };

        lightbox.onclick = (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
                lightboxContent.innerHTML = '';
            }
        };
    </script>
</body>
</html>
